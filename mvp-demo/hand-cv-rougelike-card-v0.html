<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Arcana: 手势秘术 | 赛博Roguelike</title>
    
    <!-- Tone.js 保持原样 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #050508;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            position: relative;
        }
        
        /* CRT 扫描线效果 */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 1000;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        /* UI 层 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .hud-panel {
            position: absolute;
            background: rgba(10, 10, 20, 0.9);
            border: 1px solid #0ff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            padding: 15px;
            border-radius: 4px;
            pointer-events: auto;
        }
        
        #webcam-preview {
            bottom: 20px;
            left: 20px;
            width: 240px;
            height: 180px;
            overflow: hidden;
            transform: scaleX(-1); /* 镜像 */
        }
        
        #webcam-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }
        
        #gesture-indicator {
            bottom: 20px;
            right: 20px;
            width: 200px;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #f0f;
        }
        
        .gesture-icon {
            font-size: 48px;
            margin: 10px 0;
            text-shadow: 0 0 20px currentColor;
            transition: all 0.3s;
        }
        
        .gesture-active {
            color: #0ff;
            transform: scale(1.2);
            text-shadow: 0 0 40px #0ff;
        }
        
        #player-stats {
            top: 20px;
            left: 20px;
            min-width: 200px;
        }
        
        .stat-bar {
            margin: 8px 0;
            height: 20px;
            background: #111;
            border: 1px solid #333;
            position: relative;
            overflow: hidden;
        }
        
        .stat-fill {
            height: 100%;
            transition: width 0.3s;
            position: relative;
        }
        
        .hp-fill { background: linear-gradient(90deg, #f00, #f80); }
        .energy-fill { background: linear-gradient(90deg, #00f, #0ff); }
        
        .stat-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        
        /* 地图界面 */
        #map-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
            display: none;
            z-index: 200;
        }
        
        .map-node {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #222;
            border: 3px solid #444;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            pointer-events: auto;
        }
        
        .map-node:hover { transform: scale(1.2); }
        .map-node.battle { border-color: #f00; box-shadow: 0 0 15px #f00; }
        .map-node.shop { border-color: #ff0; box-shadow: 0 0 15px #ff0; }
        .map-node.rest { border-color: #0f0; box-shadow: 0 0 15px #0f0; }
        .map-node.boss { border-color: #f0f; box-shadow: 0 0 30px #f0f; animation: pulse 2s infinite; }
        .map-node.current { background: #fff; }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .map-path {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, #444, #666, #444);
            transform-origin: left center;
            z-index: -1;
        }
        
        /* 开始屏幕 */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0c0c1d 0%, #1a0b2e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        h1 {
            font-size: 72px;
            background: linear-gradient(45deg, #0ff, #f0f, #0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            margin-bottom: 20px;
            letter-spacing: 4px;
        }
        
        .subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 8px;
        }
        
        button {
            padding: 15px 40px;
            font-size: 20px;
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 4px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 30px #0ff;
        }
        
        .loading {
            margin-top: 20px;
            color: #f0f;
            font-size: 14px;
        }
        
        .error {
            margin-top: 20px;
            color: #f44;
            font-size: 14px;
            max-width: 600px;
            text-align: center;
            line-height: 1.6;
        }
        
        .hidden { display: none !important; }
        
        /* 伤害数字 */
        .damage-text {
            position: absolute;
            font-size: 32px;
            font-weight: bold;
            color: #f00;
            text-shadow: 0 0 10px #f00;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }
        
        .crit-text { color: #ff0; font-size: 48px; }
        .heal-text { color: #0f0; }
    </style>
</head>
<body class="crt">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="player-stats" class="hud-panel">
            <div>Cyber-Mage <span style="color:#0ff">Lv.<span id="level">1</span></span></div>
            <div class="stat-bar">
                <div class="stat-fill hp-fill" id="hp-bar" style="width: 100%"></div>
                <div class="stat-text"><span id="hp-text">100/100</span> HP</div>
            </div>
            <div class="stat-bar">
                <div class="stat-fill energy-fill" id="energy-bar" style="width: 100%"></div>
                <div class="stat-text"><span id="energy-text">3/3</span> ENERGY</div>
            </div>
            <div style="margin-top:10px; font-size:12px; color:#888;">
                Deck: <span id="deck-count" style="color:#fff">10</span> | 
                Discard: <span id="discard-count" style="color:#666">0</span>
            </div>
        </div>
        
        <div id="webcam-preview" class="hud-panel">
            <video id="webcam-video" autoplay playsinline></video>
            <div style="position:absolute; bottom:5px; left:5px; font-size:10px; color:#0ff;">
                NEURAL LINK: <span id="link-status">OFFLINE</span>
            </div>
        </div>
        
        <div id="gesture-indicator" class="hud-panel">
            <div style="font-size:12px; color:#888; margin-bottom:5px;">GESTURE LOCK</div>
            <div class="gesture-icon" id="current-gesture">✋</div>
            <div id="gesture-name" style="font-size:14px; color:#fff;">WAITING...</div>
            <div id="gesture-confidence" style="font-size:10px; color:#666; margin-top:5px;">0%</div>
        </div>
    </div>
    
    <div id="map-screen"></div>
    
    <div id="start-screen">
        <h1>NEON ARCANA</h1>
        <div class="subtitle">Gesture-Based Cyber Roguelike</div>
        <button id="start-btn">初始化神经连接</button>
        <div class="loading hidden" id="loading-text">正在校准手势识别引擎...</div>
        <div class="error hidden" id="error-text"></div>
    </div>

    <script type="module">
        /**
         * NEON ARCANA - 手势识别卡牌游戏
         * 修复版：使用 ES 模块动态导入 MediaPipe
         */

        // ==================== 音频系统 ====================
        class AudioController {
            constructor() {
                this.initialized = false;
                this.synth = null;
                this.noise = null;
            }
            
            async init() {
                await Tone.start();
                this.synth = new Tone.PolySynth(Tone.Synth).toDestination();
                this.synth.volume.value = -10;
                
                this.noise = new Tone.NoiseSynth({
                    noise: { type: 'pink' },
                    envelope: { attack: 0.005, decay: 0.1, sustain: 0 }
                }).toDestination();
                
                this.initialized = true;
            }
            
            playCardPlay() {
                if(!this.initialized) return;
                this.synth.triggerAttackRelease(["C5", "E5"], "8n");
            }
            
            playDamage() {
                if(!this.initialized) return;
                this.noise.triggerAttackRelease("16n");
            }
            
            playHeal() {
                if(!this.initialized) return;
                this.synth.triggerAttackRelease(["G4", "C5"], "4n");
            }
            
            playGestureLock() {
                if(!this.initialized) return;
                this.synth.triggerAttackRelease("A5", "32n");
            }
        }

        // ==================== 粒子系统 ====================
        class ParticleSystem {
            constructor(ctx) {
                this.ctx = ctx;
                this.particles = [];
            }
            
            emit(x, y, color, count = 10, type = 'burst') {
                for(let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count;
                    const speed = 2 + Math.random() * 4;
                    this.particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1.0,
                        color,
                        size: 2 + Math.random() * 4,
                        type
                    });
                }
            }
            
            emitTrail(x, y, color) {
                this.particles.push({
                    x: x + (Math.random() - 0.5) * 10,
                    y: y + (Math.random() - 0.5) * 10,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    life: 0.5 + Math.random() * 0.5,
                    color,
                    size: 1 + Math.random() * 2,
                    type: 'trail'
                });
            }
            
            update() {
                this.particles = this.particles.filter(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.02;
                    p.vx *= 0.98;
                    p.vy *= 0.98;
                    return p.life > 0;
                });
            }
            
            draw() {
                this.particles.forEach(p => {
                    this.ctx.globalAlpha = p.life;
                    this.ctx.fillStyle = p.color;
                    this.ctx.shadowBlur = 10;
                    this.ctx.shadowColor = p.color;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.shadowBlur = 0;
                    this.ctx.globalAlpha = 1;
                });
            }
        }

        // ==================== 卡牌系统 ====================
        class Card {
            constructor(data) {
                this.id = Math.random().toString(36).substr(2, 9);
                this.name = data.name;
                this.cost = data.cost;
                this.damage = data.damage;
                this.block = data.block;
                this.heal = data.heal || 0;
                this.gesture = data.gesture;
                this.color = data.color;
                this.description = data.description;
                this.rarity = data.rarity || 'common';
                
                this.x = 0;
                this.y = 0;
                this.targetX = 0;
                this.targetY = 0;
                this.targetRotation = 0;
                this.rotation = 0;
                this.scale = 1;
                this.hovered = false;
                this.selected = false;
                this.gestureMatched = false;
                this.chargeLevel = 0;
            }
            
            update() {
                this.x += (this.targetX - this.x) * 0.1;
                this.y += (this.targetY - this.y) * 0.1;
                this.rotation += (this.targetRotation - this.rotation) * 0.1;
                
                if(this.gestureMatched && this.chargeLevel < 1) {
                    this.chargeLevel += 0.02;
                } else if(!this.gestureMatched && this.chargeLevel > 0) {
                    this.chargeLevel -= 0.05;
                }
            }
            
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.scale(this.scale, this.scale);
                
                if(this.chargeLevel > 0) {
                    ctx.shadowBlur = 20 + this.chargeLevel * 30;
                    ctx.shadowColor = this.color;
                    ctx.strokeStyle = `rgba(255, 255, 255, ${this.chargeLevel})`;
                    ctx.lineWidth = 3;
                } else {
                    ctx.strokeStyle = '#444';
                    ctx.lineWidth = 1;
                }
                
                const gradient = ctx.createLinearGradient(-60, -90, 60, 90);
                gradient.addColorStop(0, '#1a1a2e');
                gradient.addColorStop(1, '#16213e');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.roundRect(-70, -100, 140, 200, 10);
                ctx.fill();
                ctx.stroke();
                
                ctx.fillStyle = '#0ff';
                ctx.beginPath();
                ctx.arc(-50, -80, 15, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.cost, -50, -75);
                
                ctx.font = '40px Arial';
                ctx.fillStyle = this.gestureMatched ? '#0ff' : '#666';
                ctx.fillText(this.getGestureIcon(), 0, -40);
                
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px Courier New';
                ctx.fillText(this.name.toUpperCase(), 0, 0);
                
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-50, 10);
                ctx.lineTo(50, 10);
                ctx.stroke();
                
                ctx.fillStyle = '#aaa';
                ctx.font = '12px Courier New';
                const lines = this.description.split('\n');
                lines.forEach((line, i) => {
                    ctx.fillText(line, 0, 35 + i * 16);
                });
                
                let bottomY = 80;
                if(this.damage > 0) {
                    ctx.fillStyle = '#f44';
                    ctx.font = 'bold 18px Arial';
                    ctx.fillText(`⚔ ${this.damage}`, -30, bottomY);
                }
                if(this.block > 0) {
                    ctx.fillStyle = '#48f';
                    ctx.font = 'bold 18px Arial';
                    ctx.fillText(`🛡 ${this.block}`, 30, bottomY);
                }
                
                ctx.restore();
            }
            
            getGestureIcon() {
                const icons = {
                    'Closed_Fist': '✊',
                    'Open_Palm': '✋',
                    'Pointing_Up': '☝️',
                    'Thumb_Up': '👍',
                    'Thumb_Down': '👎',
                    'Victory': '✌️',
                    'ILoveYou': '🤟'
                };
                return icons[this.gesture] || '❓';
            }
        }

        // ==================== 敌人系统 ====================
        class Enemy {
            constructor(type) {
                this.type = type;
                this.maxHp = type === 'boss' ? 200 : 50 + Math.random() * 50;
                this.hp = this.maxHp;
                this.intent = null;
                this.x = 0;
                this.y = 0;
                this.shake = 0;
                this.nextAttack = 0;
                this.block = 0;
                this.generateIntent();
            }
            
            generateIntent() {
                const intents = ['attack', 'defend', 'buff'];
                this.intent = intents[Math.floor(Math.random() * intents.length)];
                this.nextAttack = this.intent === 'attack' ? Math.floor(10 + Math.random() * 15) : 0;
            }
            
            takeDamage(dmg) {
                const actual = Math.max(0, dmg - this.block);
                this.block = Math.max(0, this.block - dmg);
                this.hp -= actual;
                this.shake = 10;
                return actual;
            }
            
            update() {
                if(this.shake > 0) this.shake *= 0.9;
            }
            
            draw(ctx, centerX, y) {
                this.x = centerX;
                this.y = y;
                
                ctx.save();
                ctx.translate(centerX + (Math.random() - 0.5) * this.shake, y);
                
                const gradient = ctx.createRadialGradient(0, 0, 10, 0, 0, 80);
                gradient.addColorStop(0, '#f0f');
                gradient.addColorStop(0.5, '#80f');
                gradient.addColorStop(1, 'transparent');
                
                ctx.fillStyle = gradient;
                ctx.globalAlpha = 0.3;
                ctx.beginPath();
                ctx.arc(0, 0, 80, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
                
                ctx.fillStyle = '#f0f';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#f0f';
                ctx.beginPath();
                ctx.arc(0, 0, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.getIntentIcon(), 0, -60);
                
                const barWidth = 100;
                ctx.fillStyle = '#300';
                ctx.fillRect(-barWidth/2, 50, barWidth, 10);
                ctx.fillStyle = '#f0f';
                ctx.fillRect(-barWidth/2, 50, barWidth * (this.hp / this.maxHp), 10);
                
                if(this.nextAttack > 0) {
                    ctx.fillStyle = '#f44';
                    ctx.font = 'bold 16px Arial';
                    ctx.fillText(`${this.nextAttack}⚔`, 60, -20);
                }
                
                if(this.block > 0) {
                    ctx.strokeStyle = '#48f';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, 35, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = '#48f';
                    ctx.fillText(`🛡${this.block}`, 40, 0);
                }
                
                ctx.restore();
            }
            
            getIntentIcon() {
                return {
                    'attack': '⚔️',
                    'defend': '🛡️',
                    'buff': '⚡'
                }[this.intent];
            }
        }

        // ==================== 手势识别控制器 ====================
        class GestureController {
            constructor() {
                this.gestureRecognizer = null;
                this.video = document.getElementById('webcam-video');
                this.lastGesture = null;
                this.gestureHistory = [];
                this.confidence = 0;
                this.running = false;
                this.GestureRecognizer = null;
                this.FilesetResolver = null;
            }
            
            async init() {
                try {
                    // 动态导入 MediaPipe ES 模块
                    const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm");
                    this.GestureRecognizer = vision.GestureRecognizer;
                    this.FilesetResolver = vision.FilesetResolver;
                    
                    const visionGenAI = await this.FilesetResolver.forVisionTasks(
                        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                    );
                    
                    this.gestureRecognizer = await this.GestureRecognizer.createFromOptions(visionGenAI, {
                        baseOptions: {
                            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
                            delegate: "GPU"
                        },
                        runningMode: "VIDEO"
                    });
                    
                    // 启动摄像头
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: 640, height: 480 } 
                    });
                    this.video.srcObject = stream;
                    
                    return new Promise((resolve) => {
                        this.video.onloadeddata = () => {
                            this.running = true;
                            document.getElementById('link-status').textContent = "ONLINE";
                            document.getElementById('link-status').style.color = "#0f0";
                            resolve();
                        };
                    });
                } catch (error) {
                    console.error("Gesture initialization failed:", error);
                    throw new Error("摄像头或手势识别初始化失败: " + error.message);
                }
            }
            
            detect() {
                if(!this.running || !this.gestureRecognizer) return null;
                
                const results = this.gestureRecognizer.recognizeForVideo(this.video, performance.now());
                
                if(results.gestures.length > 0) {
                    const gesture = results.gestures[0][0];
                    this.confidence = gesture.score;
                    
                    this.gestureHistory.push(gesture.categoryName);
                    if(this.gestureHistory.length > 5) this.gestureHistory.shift();
                    
                    const allSame = this.gestureHistory.every(g => g === gesture.categoryName);
                    if(allSame && this.gestureHistory.length === 5) {
                        if(this.lastGesture !== gesture.categoryName) {
                            this.lastGesture = gesture.categoryName;
                            this.onGestureChange(gesture.categoryName);
                        }
                    }
                    
                    return {
                        name: gesture.categoryName,
                        confidence: gesture.score
                    };
                } else {
                    this.gestureHistory = [];
                    return null;
                }
            }
            
            onGestureChange(gestureName) {
                audio.playGestureLock();
                
                const icon = {
                    'Closed_Fist': '✊',
                    'Open_Palm': '✋',
                    'Pointing_Up': '☝️',
                    'Thumb_Up': '👍',
                    'Thumb_Down': '👎',
                    'Victory': '✌️',
                    'ILoveYou': '🤟',
                    'None': '❓'
                }[gestureName] || '❓';
                
                const el = document.getElementById('current-gesture');
                el.textContent = icon;
                el.classList.add('gesture-active');
                setTimeout(() => el.classList.remove('gesture-active'), 300);
                
                document.getElementById('gesture-name').textContent = gestureName.replace(/_/g, ' ');
                document.getElementById('gesture-confidence').textContent = 
                    Math.floor(this.confidence * 100) + '%';
            }
            
            getCurrentGesture() {
                return this.lastGesture;
            }
        }

        // ==================== 游戏主逻辑 ====================
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                
                this.state = 'START';
                this.gestureController = new GestureController();
                this.particles = new ParticleSystem(this.ctx);
                
                this.player = {
                    maxHp: 100,
                    hp: 100,
                    energy: 3,
                    maxEnergy: 3,
                    deck: [],
                    hand: [],
                    discard: [],
                    level: 1,
                    block: 0
                };
                
                this.enemies = [];
                this.turn = 'player';
                this.selectedCard = null;
                this.mapNodes = [];
                this.currentNode = 0;
                this.cameraShake = 0;
                
                this.initDeck();
                this.setupEventListeners();
                
                window.addEventListener('resize', () => this.resize());
                this.loop();
            }
            
            initDeck() {
                const starterCards = [
                    { name: '重击', cost: 1, damage: 10, block: 0, gesture: 'Closed_Fist', color: '#f44', description: '造成10点伤害' },
                    { name: '护盾', cost: 1, damage: 0, block: 8, gesture: 'Open_Palm', color: '#48f', description: '获得8点格挡' },
                    { name: '穿刺', cost: 1, damage: 6, block: 0, gesture: 'Pointing_Up', color: '#f80', description: '造成6点伤害\n无视格挡' },
                    { name: '双重打击', cost: 2, damage: 16, block: 0, gesture: 'Victory', color: '#f0f', description: '造成16点伤害' },
                    { name: '治疗协议', cost: 1, damage: 0, block: 4, heal: 5, gesture: 'Thumb_Up', color: '#0f0', description: '回复5生命\n获得4格挡' }
                ];
                
                for(let i = 0; i < 3; i++) this.player.deck.push(new Card(starterCards[0]));
                for(let i = 0; i < 2; i++) this.player.deck.push(new Card(starterCards[1]));
                this.player.deck.push(new Card(starterCards[2]));
                this.player.deck.push(new Card(starterCards[3]));
                this.player.deck.push(new Card(starterCards[4]));
                
                this.shuffleDeck();
            }
            
            shuffleDeck() {
                for(let i = this.player.deck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.player.deck[i], this.player.deck[j]] = 
                    [this.player.deck[j], this.player.deck[i]];
                }
            }
            
            drawHand() {
                this.player.hand = [];
                const handSize = Math.min(5, this.player.deck.length);
                for(let i = 0; i < handSize; i++) {
                    if(this.player.deck.length > 0) {
                        this.player.hand.push(this.player.deck.pop());
                    }
                }
                this.arrangeHand();
            }
            
            arrangeHand() {
                const startX = this.canvas.width / 2 - (this.player.hand.length - 1) * 80;
                const y = this.canvas.height - 150;
                
                this.player.hand.forEach((card, i) => {
                    card.targetX = startX + i * 160;
                    card.targetY = y;
                    card.targetRotation = (i - (this.player.hand.length - 1) / 2) * 0.1;
                });
            }
            
            startBattle(type = 'normal') {
                this.state = 'BATTLE';
                this.enemies = [];
                this.player.energy = this.player.maxEnergy;
                this.player.block = 0;
                this.turn = 'player';
                
                if(type === 'boss') {
                    this.enemies.push(new Enemy('boss'));
                } else {
                    const count = 1 + Math.floor(Math.random() * 2);
                    for(let i = 0; i < count; i++) {
                        this.enemies.push(new Enemy('normal'));
                    }
                }
                
                this.drawHand();
            }
            
            update() {
                if(this.cameraShake > 0) this.cameraShake *= 0.9;
                
                this.particles.update();
                
                if(this.state === 'BATTLE' && this.turn === 'player') {
                    const gesture = this.gestureController.detect();
                    if(gesture) {
                        this.checkGestureMatch(gesture.name);
                    }
                }
                
                this.player.hand.forEach(card => card.update());
                this.enemies.forEach(e => e.update());
                
                if(this.state === 'BATTLE' && this.enemies.every(e => e.hp <= 0)) {
                    setTimeout(() => this.winBattle(), 1000);
                }
            }
            
            checkGestureMatch(gestureName) {
                this.player.hand.forEach(card => {
                    if(card.gesture === gestureName && this.player.energy >= card.cost) {
                        card.gestureMatched = true;
                        if(card.chargeLevel >= 1 && !card.selected) {
                            this.playCard(card);
                        }
                    } else {
                        card.gestureMatched = false;
                    }
                });
            }
            
            playCard(card) {
                const target = this.enemies.find(e => e.hp > 0);
                if(!target) return;
                
                this.player.energy -= card.cost;
                card.selected = true;
                
                this.animateCardAttack(card, target, () => {
                    if(card.damage > 0) {
                        const dmg = target.takeDamage(card.damage);
                        this.particles.emit(target.x, target.y, '#f44', 20);
                        this.showDamage(target.x, target.y, dmg, false);
                        this.cameraShake = 5;
                        audio.playDamage();
                    }
                    
                    if(card.block > 0) {
                        this.player.block += card.block;
                        this.particles.emit(this.canvas.width/2, this.canvas.height - 100, '#48f', 15);
                        audio.playHeal();
                    }
                    
                    if(card.heal > 0) {
                        this.player.hp = Math.min(this.player.maxHp, this.player.hp + card.heal);
                        this.showDamage(this.canvas.width/2, this.canvas.height - 200, card.heal, true);
                    }
                    
                    this.player.hand = this.player.hand.filter(c => c !== card);
                    this.player.discard.push(card);
                    this.arrangeHand();
                    
                    if(this.player.energy === 0 || this.player.hand.length === 0) {
                        this.endPlayerTurn();
                    }
                });
            }
            
            animateCardAttack(card, target, callback) {
                const startX = card.x;
                const startY = card.y;
                const startTime = Date.now();
                const duration = 400;
                
                const animate = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    const t = progress;
                    const cx = (startX + target.x) / 2;
                    const cy = startY - 200;
                    
                    card.x = (1-t)*(1-t)*startX + 2*(1-t)*t*cx + t*t*target.x;
                    card.y = (1-t)*(1-t)*startY + 2*(1-t)*t*cy + t*t*target.y;
                    card.rotation += 0.2;
                    card.scale = 1 - progress * 0.5;
                    
                    if(Math.random() > 0.5) {
                        this.particles.emitTrail(card.x, card.y, card.color);
                    }
                    
                    if(progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        audio.playCardPlay();
                        callback();
                    }
                };
                animate();
            }
            
            endPlayerTurn() {
                this.turn = 'enemy';
                setTimeout(() => this.enemyTurn(), 1000);
            }
            
            enemyTurn() {
                this.enemies.forEach((enemy, index) => {
                    if(enemy.hp <= 0) return;
                    
                    setTimeout(() => {
                        if(enemy.intent === 'attack' && enemy.nextAttack > 0) {
                            const dmg = Math.max(0, enemy.nextAttack - this.player.block);
                            this.player.block = Math.max(0, this.player.block - enemy.nextAttack);
                            this.player.hp -= dmg;
                            
                            this.cameraShake = 10;
                            this.showDamage(this.canvas.width/2, this.canvas.height/2, dmg, false);
                            this.particles.emit(this.canvas.width/2, this.canvas.height/2, '#f00', 30);
                            
                            if(this.player.hp <= 0) this.gameOver();
                        } else if(enemy.intent === 'defend') {
                            enemy.block += 10;
                        }
                        
                        enemy.generateIntent();
                    }, index * 800);
                });
                
                setTimeout(() => {
                    if(this.player.hp > 0) {
                        this.turn = 'player';
                        this.player.energy = this.player.maxEnergy;
                        this.player.block = 0;
                        
                        if(this.player.deck.length < 5) {
                            this.player.deck = [...this.player.discard, ...this.player.deck];
                            this.player.discard = [];
                            this.shuffleDeck();
                        }
                        
                        this.drawHand();
                    }
                }, this.enemies.length * 800 + 1000);
            }
            
            showDamage(x, y, amount, isHeal) {
                const el = document.createElement('div');
                el.className = `damage-text ${isHeal ? 'heal-text' : ''}`;
                el.textContent = amount;
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1000);
            }
            
            winBattle() {
                this.state = 'REWARD';
                this.player.level++;
                setTimeout(() => this.generateMap(), 2000);
            }
            
            generateMap() {
                this.state = 'MAP';
                const mapScreen = document.getElementById('map-screen');
                mapScreen.innerHTML = '';
                mapScreen.style.display = 'block';
                
                this.mapNodes = [];
                const levels = 5;
                
                for(let i = 0; i < levels; i++) {
                    const node = document.createElement('div');
                    const type = i === levels - 1 ? 'boss' : 
                                Math.random() > 0.7 ? 'shop' : 
                                Math.random() > 0.5 ? 'rest' : 'battle';
                    
                    node.className = `map-node ${type} ${i === 0 ? 'current' : ''}`;
                    node.style.left = (15 + i * 18) + '%';
                    node.style.top = (30 + Math.sin(i) * 20) + '%';
                    node.textContent = {battle: '⚔', shop: '$', rest: '+', boss: '👹'}[type];
                    
                    node.onclick = () => {
                        if(i === this.currentNode + 1) {
                            this.currentNode = i;
                            mapScreen.style.display = 'none';
                            if(type === 'battle' || type === 'boss') {
                                this.startBattle(type);
                            }
                        }
                    };
                    
                    mapScreen.appendChild(node);
                    this.mapNodes.push(node);
                }
            }
            
            gameOver() {
                this.state = 'GAME_OVER';
                alert('神经连接断开... 游戏结束');
                location.reload();
            }
            
            draw() {
                const ctx = this.ctx;
                const w = this.canvas.width;
                const h = this.canvas.height;
                
                ctx.fillStyle = 'rgba(5, 5, 8, 0.3)';
                ctx.fillRect(0, 0, w, h);
                
                ctx.save();
                if(this.cameraShake > 0.5) {
                    ctx.translate(
                        (Math.random() - 0.5) * this.cameraShake,
                        (Math.random() - 0.5) * this.cameraShake
                    );
                }
                
                if(this.state === 'BATTLE') {
                    ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
                    ctx.lineWidth = 1;
                    for(let i = 0; i < w; i += 50) {
                        ctx.beginPath();
                        ctx.moveTo(i, 0);
                        ctx.lineTo(i, h);
                        ctx.stroke();
                    }
                    
                    this.enemies.forEach((enemy, i) => {
                        const x = w / 2 + (i - (this.enemies.length-1)/2) * 200;
                        enemy.draw(ctx, x, h / 3);
                    });
                    
                    this.player.hand.forEach(card => card.draw(ctx));
                    
                    ctx.fillStyle = this.turn === 'player' ? '#0ff' : '#f0f';
                    ctx.font = 'bold 24px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText(this.turn === 'player' ? '<< 玩家回合 >>' : '<< 敌方回合 >>', w/2, 50);
                    
                    this.particles.draw();
                }
                
                ctx.restore();
                
                document.getElementById('hp-bar').style.width = (this.player.hp / this.player.maxHp * 100) + '%';
                document.getElementById('hp-text').textContent = `${this.player.hp}/${this.player.maxHp}`;
                document.getElementById('energy-bar').style.width = (this.player.energy / this.player.maxEnergy * 100) + '%';
                document.getElementById('energy-text').textContent = `${this.player.energy}/${this.player.maxEnergy}`;
                document.getElementById('deck-count').textContent = this.player.deck.length;
                document.getElementById('discard-count').textContent = this.player.discard.length;
                document.getElementById('level').textContent = this.player.level;
            }
            
            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
            
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                if(this.state === 'BATTLE') this.arrangeHand();
            }
            
            setupEventListeners() {
                this.canvas.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    this.player.hand.forEach(card => {
                        const dx = x - card.x;
                        const dy = y - card.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        card.hovered = dist < 70;
                        card.targetY = card.hovered ? this.canvas.height - 200 : this.canvas.height - 150;
                    });
                });
                
                document.getElementById('start-btn').addEventListener('click', async () => {
                    const loading = document.getElementById('loading-text');
                    const error = document.getElementById('error-text');
                    const btn = document.getElementById('start-btn');
                    
                    loading.classList.remove('hidden');
                    error.classList.add('hidden');
                    btn.disabled = true;
                    
                    try {
                        await audio.init();
                        await this.gestureController.init();
                        document.getElementById('start-screen').style.display = 'none';
                        this.generateMap();
                    } catch (err) {
                        loading.classList.add('hidden');
                        error.classList.remove('hidden');
                        error.textContent = "错误: " + err.message + "\n请确保允许摄像头权限，并使用 Chrome/Edge 浏览器";
                        btn.disabled = false;
                    }
                });
            }
        }

        const audio = new AudioController();
        const game = new Game();
    </script>
</body>
</html>
